# Estate Sentry Docker Compose Configuration
# Run with: docker compose up -d

services:
  # =============================================================================
  # DATABASES
  # =============================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: estate-sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estate_sentry}
      POSTGRES_USER: ${POSTGRES_USER:-estate_sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estate_sentry} -d ${POSTGRES_DB:-estate_sentry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estate-sentry

  neo4j:
    image: neo4j:5-community
    container_name: estate-sentry-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - estate-sentry

  # =============================================================================
  # SWITCHBOARD INFRASTRUCTURE
  # =============================================================================

  nats:
    image: nats:2.10-alpine
    container_name: estate-sentry-nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    volumes:
      - ./data/nats:/data
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estate-sentry

  minio:
    image: minio/minio:latest
    container_name: estate-sentry-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - estate-sentry

  # =============================================================================
  # VECTOR DATABASE
  # =============================================================================

  chromadb:
    image: chromadb/chroma:latest
    container_name: estate-sentry-chromadb
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS_FILE: ""
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: ""
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ./data/chromadb:/chroma/chroma
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - estate-sentry

  # =============================================================================
  # APPLICATION SERVICES
  # =============================================================================

  api:
    build:
      context: ./estate-sentry-api
      dockerfile: Dockerfile
    container_name: estate-sentry-api
    restart: unless-stopped
    environment:
      # Django
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}

      # PostgreSQL
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-estate_sentry}
      POSTGRES_USER: ${POSTGRES_USER:-estate_sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}

      # NATS
      NATS_URL: nats://nats:4222

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-estate-sentry}
      MINIO_SECURE: "false"

      # ChromaDB
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - ./estate-sentry-api:/app
      - api-staticfiles:/app/staticfiles
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - estate-sentry

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  estate-sentry:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  api-staticfiles:
