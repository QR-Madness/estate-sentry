name: API Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: estate-sentry-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml, rather
        # than silently re-resolving. CI should test what the lock describes.
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Run tests
        run: uv run python manage.py test
