version: '3'

vars:
  API_DIR: estate-sentry-api
  HQ_DIR: estate-sentry-hq
  DATA_DIR: data
  # Cross-platform Python binary detection
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

env:
  # Ensure uv uses project directory
  UV_PROJECT_ENVIRONMENT: '{{.API_DIR}}/.venv'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # Setup and Installation
  # ============================================================================
  setup:
    desc: Complete project setup (API + HQ)
    cmds:
      - task: setup:dirs
      - task: install
      - task: api:migrate
      - echo "Setup complete! Run 'task dev' to start both servers"

  setup:dirs:
    desc: Create required directories
    cmds:
      - mkdir -p {{.DATA_DIR}}/{postgres,neo4j/data,neo4j/logs,neo4j/import,neo4j/plugins,minio,nats,chromadb,backups}
    status:
      - test -d {{.DATA_DIR}}/postgres

  install:
    desc: Install all dependencies (API + HQ)
    cmds:
      - task: api:install
      - task: hq:install

  clean:
    desc: Remove build artifacts and caches
    cmds:
      - task: api:clean
      - task: hq:clean
      - echo "Cleanup complete"

  # ============================================================================
  # Development Servers
  # ============================================================================
  dev:
    desc: Start both API and HQ development servers
    deps:
      - api:dev
      - hq:dev

  dev:api:
    desc: Start API development server only
    cmds:
      - task: api:dev

  dev:hq:
    desc: Start HQ development server only
    cmds:
      - task: hq:dev

  # ============================================================================
  # API Tasks (Python with uv)
  # ============================================================================
  api:install:
    desc: Install API dependencies with uv
    dir: '{{.API_DIR}}'
    cmds:
      - uv sync
      - echo "API dependencies installed"

  api:add:
    desc: Add a Python package (usage - task api:add -- package-name)
    dir: '{{.API_DIR}}'
    cmds:
      - uv add {{.CLI_ARGS}}

  api:dev:
    desc: Start API development server
    dir: '{{.API_DIR}}'
    cmds:
      - echo "Starting Django development server on http://localhost:8000"
      - uv run python manage.py runserver

  api:shell:
    desc: Open Django shell
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py shell

  api:migrate:
    desc: Run database migrations
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py migrate
      - echo "Migrations applied"

  api:makemigrations:
    desc: Create new database migrations
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py makemigrations
      - echo "Migrations created"

  api:superuser:
    desc: Create Django superuser
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py createsuperuser

  api:test:
    desc: Run API tests
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py test

  api:test:verbose:
    desc: Run API tests with verbose output
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py test --verbosity=2

  api:test:coverage:
    desc: Run API tests with coverage report
    dir: '{{.API_DIR}}'
    cmds:
      - uv run pytest --cov=. --cov-report=html --cov-report=term

  api:lint:
    desc: Lint API code with ruff
    dir: '{{.API_DIR}}'
    cmds:
      - uv run ruff check .

  api:lint:fix:
    desc: Fix API lint errors with ruff
    dir: '{{.API_DIR}}'
    cmds:
      - uv run ruff check --fix .

  api:format:
    desc: Format API code with ruff
    dir: '{{.API_DIR}}'
    cmds:
      - uv run ruff format .

  api:check:
    desc: Run Django system checks
    dir: '{{.API_DIR}}'
    cmds:
      - uv run python manage.py check

  api:clean:
    desc: Remove API build artifacts and caches
    dir: '{{.API_DIR}}'
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete 2>/dev/null || true
      - find . -type f -name "*.pyo" -delete 2>/dev/null || true
      - rm -rf .pytest_cache htmlcov .coverage .ruff_cache 2>/dev/null || true
      - echo "API cleanup complete"

  api:reset-db:
    desc: Reset SQLite database (CAUTION - deletes all data)
    dir: '{{.API_DIR}}'
    prompt: This will delete all data. Continue?
    cmds:
      - rm -f db.sqlite3
      - uv run python manage.py migrate
      - echo "Database reset complete"

  # ============================================================================
  # HQ Tasks (TypeScript with bun)
  # ============================================================================
  hq:install:
    desc: Install HQ dependencies with bun
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun install
      - echo "HQ dependencies installed"

  hq:add:
    desc: Add a package (usage - task hq:add -- package-name)
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun add {{.CLI_ARGS}}

  hq:dev:
    desc: Start HQ development server
    dir: '{{.HQ_DIR}}'
    cmds:
      - echo "Starting Next.js development server on http://localhost:3000"
      - bun run dev

  hq:build:
    desc: Build HQ for production
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun run build
      - echo "HQ built successfully"

  hq:start:
    desc: Start HQ production server
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun run start

  hq:lint:
    desc: Lint HQ code
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun run lint

  hq:test:
    desc: Run HQ tests
    dir: '{{.HQ_DIR}}'
    cmds:
      - bun test

  hq:clean:
    desc: Remove HQ build artifacts
    dir: '{{.HQ_DIR}}'
    cmds:
      - rm -rf .next out node_modules/.cache 2>/dev/null || true
      - echo "HQ cleanup complete"

  # ============================================================================
  # Testing
  # ============================================================================
  test:
    desc: Run all tests (API + HQ)
    cmds:
      - task: api:test
      - task: hq:test

  check:
    desc: Run all checks (lint, test, system checks)
    cmds:
      - task: api:check
      - task: api:lint
      - task: hq:lint
      - echo "All checks passed"

  format:
    desc: Format all code
    cmds:
      - task: api:format
      - echo "Code formatted"

  # ============================================================================
  # Docker Tasks
  # ============================================================================
  docker:build:
    desc: Build all Docker images
    cmds:
      - docker compose build
      - echo "Docker images built successfully"

  docker:build:api:
    desc: Build API Docker image only
    cmds:
      - docker compose build api
      - echo "API image built"

  docker:build:hq:
    desc: Build HQ Docker image only
    cmds:
      - docker compose build hq
      - echo "HQ image built"

  docker:up:
    desc: Start all services with Docker Compose
    cmds:
      - task: setup:dirs
      - docker compose up -d
      - echo ""
      - echo "Services started:"
      - echo "  API          - http://localhost:8000"
      - echo "  HQ           - http://localhost:3000"
      - echo "  Neo4j        - http://localhost:7474"
      - echo "  MinIO        - http://localhost:9001"
      - echo "  NATS         - http://localhost:8222"

  docker:up:logs:
    desc: Start services and follow logs
    cmds:
      - task: setup:dirs
      - docker compose up

  docker:down:
    desc: Stop and remove Docker containers
    cmds:
      - docker compose down
      - echo "Services stopped"

  docker:down:volumes:
    desc: Stop containers and remove volumes (deletes data)
    prompt: This will delete all Docker volumes including databases. Continue?
    cmds:
      - docker compose down -v
      - echo "Services and volumes removed"

  docker:restart:
    desc: Restart all Docker services
    cmds:
      - docker compose restart
      - echo "Services restarted"

  docker:restart:api:
    desc: Restart API service only
    cmds:
      - docker compose restart api

  docker:restart:hq:
    desc: Restart HQ service only
    cmds:
      - docker compose restart hq

  docker:logs:
    desc: View logs from all services
    cmds:
      - docker compose logs -f

  docker:logs:api:
    desc: View API logs only
    cmds:
      - docker compose logs -f api

  docker:logs:hq:
    desc: View HQ logs only
    cmds:
      - docker compose logs -f hq

  docker:logs:postgres:
    desc: View PostgreSQL logs
    cmds:
      - docker compose logs -f postgres

  docker:logs:neo4j:
    desc: View Neo4j logs
    cmds:
      - docker compose logs -f neo4j

  docker:logs:nats:
    desc: View NATS logs
    cmds:
      - docker compose logs -f nats

  docker:logs:minio:
    desc: View MinIO logs
    cmds:
      - docker compose logs -f minio

  docker:ps:
    desc: Show running Docker containers
    cmds:
      - docker compose ps

  docker:shell:api:
    desc: Open shell in API container
    cmds:
      - docker compose exec api /bin/bash

  docker:shell:postgres:
    desc: Open PostgreSQL shell
    cmds:
      - docker compose exec postgres psql -U estate_sentry -d estate_sentry

  docker:shell:neo4j:
    desc: Open Neo4j Cypher shell
    cmds:
      - docker compose exec neo4j cypher-shell -u neo4j -p "${NEO4J_PASSWORD:-changeme}"

  docker:clean:
    desc: Remove all stopped containers and unused images
    cmds:
      - docker compose down
      - docker system prune -f
      - echo "Docker cleanup complete"

  # ============================================================================
  # Database Tasks
  # ============================================================================
  db:backup:
    desc: Backup SQLite database
    dir: '{{.API_DIR}}'
    cmds:
      - mkdir -p ../{{.DATA_DIR}}/backups
      - cp db.sqlite3 "../{{.DATA_DIR}}/backups/sqlite_$(date +%Y%m%d_%H%M%S).db"
      - echo "Database backed up to {{.DATA_DIR}}/backups/"

  db:restore:
    desc: Restore latest SQLite backup
    dir: '{{.API_DIR}}'
    cmds:
      - cp "$(ls -t ../{{.DATA_DIR}}/backups/sqlite_*.db 2>/dev/null | head -1)" db.sqlite3
      - echo "Database restored"

  db:postgres:backup:
    desc: Backup PostgreSQL database from Docker
    cmds:
      - mkdir -p {{.DATA_DIR}}/backups
      - docker compose exec -T postgres pg_dump -U estate_sentry estate_sentry > "{{.DATA_DIR}}/backups/postgres_$(date +%Y%m%d_%H%M%S).sql"
      - echo "PostgreSQL backup created in {{.DATA_DIR}}/backups/"

  db:postgres:restore:
    desc: Restore PostgreSQL database from latest backup
    cmds:
      - docker compose exec -T postgres psql -U estate_sentry -d estate_sentry < "$(ls -t {{.DATA_DIR}}/backups/postgres_*.sql | head -1)"
      - echo "PostgreSQL database restored"

  db:neo4j:export:
    desc: Export Neo4j database
    cmds:
      - mkdir -p {{.DATA_DIR}}/backups
      - |
        docker compose exec neo4j cypher-shell -u neo4j -p "${NEO4J_PASSWORD:-changeme}" \
          "CALL apoc.export.cypher.all('/var/lib/neo4j/import/backup.cypher', {format:'cypher-shell'})"
      - cp {{.DATA_DIR}}/neo4j/import/backup.cypher "{{.DATA_DIR}}/backups/neo4j_$(date +%Y%m%d_%H%M%S).cypher"
      - echo "Neo4j database exported to {{.DATA_DIR}}/backups/"

  db:neo4j:import:
    desc: Import Neo4j database from latest export
    cmds:
      - cp "$(ls -t {{.DATA_DIR}}/backups/neo4j_*.cypher | head -1)" {{.DATA_DIR}}/neo4j/import/restore.cypher
      - docker compose exec neo4j cypher-shell -u neo4j -p "${NEO4J_PASSWORD:-changeme}" -f /var/lib/neo4j/import/restore.cypher
      - echo "Neo4j database imported"

  db:neo4j:clear:
    desc: Clear all Neo4j data (deletes all graph data)
    prompt: This will delete all Neo4j graph data. Continue?
    cmds:
      - docker compose exec neo4j cypher-shell -u neo4j -p "${NEO4J_PASSWORD:-changeme}" "MATCH (n) DETACH DELETE n"
      - echo "Neo4j database cleared"

  db:migrate:docker:
    desc: Run Django migrations in Docker container
    cmds:
      - docker compose exec api python manage.py migrate
      - echo "Migrations applied in Docker"

  db:reset:docker:
    desc: Reset PostgreSQL database in Docker (deletes all data)
    prompt: This will delete all data in PostgreSQL. Continue?
    cmds:
      - docker compose exec postgres psql -U estate_sentry -c "DROP DATABASE IF EXISTS estate_sentry;"
      - docker compose exec postgres psql -U estate_sentry -c "CREATE DATABASE estate_sentry;"
      - docker compose exec api python manage.py migrate
      - echo "PostgreSQL database reset and migrations applied"

  # ============================================================================
  # MinIO Tasks
  # ============================================================================
  minio:create-buckets:
    desc: Create MinIO buckets for Estate Sentry
    cmds:
      - |
        docker compose exec minio mc alias set local http://localhost:9000 ${MINIO_ROOT_USER:-estate-sentry} ${MINIO_ROOT_PASSWORD:-changeme}
        docker compose exec minio mc mb local/estate-sentry --ignore-existing
        docker compose exec minio mc mb local/estate-sentry-frames --ignore-existing
        docker compose exec minio mc mb local/estate-sentry-recordings --ignore-existing
      - echo "MinIO buckets created"

  # ============================================================================
  # CI/CD Tasks
  # ============================================================================
  ci:test:
    desc: Run CI tests (mimics CI environment)
    cmds:
      - task: api:lint
      - task: api:test
      - task: hq:lint
      - echo "CI checks complete"

  ci:build:
    desc: Build all images for CI
    cmds:
      - docker compose build --no-cache
      - echo "CI build complete"

  # ============================================================================
  # Documentation (mkdocs via uv, installed from docs extra)
  # ============================================================================
  docs:install:
    desc: Install documentation dependencies
    dir: '{{.API_DIR}}'
    cmds:
      - uv sync --extra docs
    status:
      - uv run --extra docs python -c "import mkdocs" 2>/dev/null

  docs:serve:
    desc: Serve documentation locally
    dir: '{{.API_DIR}}'
    deps: [docs:install]
    cmds:
      - echo "Serving docs at http://localhost:8001"
      - uv run --extra docs mkdocs serve -f ../mkdocs.yml -a localhost:8001

  docs:build:
    desc: Build documentation
    dir: '{{.API_DIR}}'
    deps: [docs:install]
    cmds:
      - uv run --extra docs mkdocs build -f ../mkdocs.yml
      - echo "Documentation built in site/"

  # ============================================================================
  # Utility Tasks
  # ============================================================================
  info:
    desc: Show project information and URLs
    cmds:
      - |
        echo "Estate Sentry - Home Threat Intelligence System"
        echo ""
        echo "Development URLs:"
        echo "  API          - http://localhost:8000"
        echo "  HQ Dashboard - http://localhost:3000"
        echo "  Admin        - http://localhost:8000/admin"
        echo ""
        echo "Docker Service URLs:"
        echo "  Neo4j        - http://localhost:7474"
        echo "  MinIO        - http://localhost:9001"
        echo "  NATS Monitor - http://localhost:8222"
        echo ""
        echo "Quick Commands:"
        echo "  task setup      - Initial project setup"
        echo "  task dev        - Start dev servers"
        echo "  task docker:up  - Start Docker services"
        echo "  task test       - Run all tests"

  version:
    desc: Show versions of tools
    cmds:
      - echo "=== Development Tools ==="
      - 'echo -n "Python:    " && python3 --version 2>/dev/null || echo "Not found"'
      - 'echo -n "uv:        " && uv --version 2>/dev/null || echo "Not found"'
      - 'echo -n "Node.js:   " && node --version 2>/dev/null || echo "Not found"'
      - 'echo -n "bun:       " && bun --version 2>/dev/null || echo "Not found"'
      - 'echo -n "Docker:    " && docker --version 2>/dev/null || echo "Not found"'
      - 'echo -n "Task:      " && task --version 2>/dev/null || echo "Not found"'

  health:
    desc: Check health of all services
    cmds:
      - |
        echo "=== Service Health Check ==="
        echo -n "API:      " && curl -s http://localhost:8000/api/health/ | head -c 50 || echo "Not running"
        echo -n "HQ:       " && curl -s http://localhost:3000 > /dev/null && echo "OK" || echo "Not running"
        echo -n "Postgres: " && docker compose exec -T postgres pg_isready -U estate_sentry > /dev/null 2>&1 && echo "OK" || echo "Not running"
        echo -n "Neo4j:    " && curl -s http://localhost:7474 > /dev/null && echo "OK" || echo "Not running"
        echo -n "NATS:     " && curl -s http://localhost:8222/healthz > /dev/null && echo "OK" || echo "Not running"
        echo -n "MinIO:    " && curl -s http://localhost:9000/minio/health/live > /dev/null && echo "OK" || echo "Not running"
